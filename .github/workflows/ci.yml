name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1

      - name: Tests
        run: python -m pytest -q

      - name: Reference data check
        run: python tools/refdata_build.py check
